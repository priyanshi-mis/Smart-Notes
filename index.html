
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Notes</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="/Smart-Notes/manifest.json">
</head>
<body>
  <div class="app">
    <header>
      <div>
        <p class="tag">YOUR PERSONAL SPACE</p>
        <h1>Smart Notes<span>.</span></h1>
        <p class="subtitle">Capture your thoughts, anytime.</p>
      </div>
      <div class="logo">✦</div>
    </header>

    <div class="stats">
      <div><strong id="total">0</strong><span>Total Notes</span></div>
      <div><strong id="today">0</strong><span>Created Today</span></div>
    </div>

    <input id="search" type="text" placeholder="⌕  Search your notes...">

    <div class="section">
      <h2>Your Notes</h2>
      <button class="add-btn" onclick="openForm()">+ New Note</button>
    </div>

    <div id="noteList" class="notes"></div>

    <div id="formBox" class="form-box hidden">
      <h2 id="formTitle">Create Note</h2>
      <input id="noteTitle" placeholder="Note title">
      <textarea id="noteContent" placeholder="Write something..."></textarea>
      <div class="actions">
        <button onclick="saveNote()" class="save-btn">Save Note</button>
        <button onclick="closeForm()" class="cancel-btn">Cancel</button>
      </div>
    </div>

    <footer>Made with ♥ | Smart Notes App</footer>
  </div>
  <script src="script.js"></script>
  <script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/Smart-Notes/sw.js");
}
</script>
</body>
</html>
